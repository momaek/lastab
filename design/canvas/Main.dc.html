</helmet>

    <span style="font-variant-numeric: tabular-nums">{{st.modified}}</span>
    <div style="flex: 1"></div>
    <span>{{t.enc}}</span>
    <span style="font-variant-numeric: tabular-nums">{{st.count}}</span>
    <button aria-describedby="copy-status" style="height: 24px; min-width: {{copyMin}}; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; background: {{copyBtn.bg}}; border: 1px solid {{copyBtn.line}}; border-radius: 4px; font: inherit; font-size: 12px; color: {{copyBtn.fg}}; white-space: nowrap">

</div>
</x-dc>

      lines = [{ n: '1', a: 'kubectl get pods -n payments | grep order-api', b: '', caret: true, hint: '', bg: c.curLine, numColor: c.text }];
    } else {
      lines = curl.map((s, i) => {
        const cur = i === 4;
        return { n: String(i + 1), a: cur ? '    "env": "staging-b"' : s, b: cur ? ',' : '', caret: cur, hint: '', bg: cur ? c.curLine : 'transparent', numColor: cur ? c.text : c.faint };
      });
    }
    let st = { text: t.saved, dot: c.okDot, color: c.muted, retry: false, dismiss: false, created: t.created, modified: t.modified, count: t.count };
    if (view === 'titlePending') st = { text: t.saving, dot: c.faint, color: c.muted, retry: false, dismiss: false, created: t.createdNew, modified: '', count: t.countNew };
    if (view === 'blank') st = { text: t.emptyNote, dot: c.faint, color: c.muted, retry: false, dismiss: false, created: '', modified: '', count: t.countBlank };
    if (view === 'saveFailed') st = { text: t.saveFailed, dot: c.danger, color: c.danger, retry: true, dismiss: false, created: t.created, modified: '', count: t.count };
    if (view === 'recovered') st = { text: t.recovered, dot: c.accent, color: c.text2, retry: false, dismiss: true, created: '', modified: '', count: t.count };
    const copied = view === 'copied';
    return {
      c, t, a, h, tools, tabs, lines, st,
      lang: en ? 'en' : 'zh-CN',
      isMac: !win, isWin: win,
      hold: view === 'holdMod',
      copied, notCopied: !copied,
      copyMin: win ? '184px' : '136px',
      copyBtn: copied ? { bg: c.okBg, line: c.okBg, fg: c.okText } : { bg: c.btn, line: c.btnLine, fg: c.text },
      copyAnnounce: copied ? (en ? 'Copied full text, 412 characters, title not included' : '已复制全部正文，412字符，不含标题') : ''
    };
  }
}
</script>
