<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>待办清单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div lang="{{lang}}" style="width: 1200px; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.bg}}; color-scheme: {{c.scheme}}; border: 1px solid {{c.frame}}; border-radius: 12px; overflow: hidden; position: relative; font-family: Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: {{c.text}}; text-autospace: normal">

  <div style="height: 44px; flex-shrink: 0; display: flex; align-items: flex-end; gap: 4px; padding: 0 8px 0 16px; background: {{c.chrome}}; border-bottom: 1px solid {{c.chromeLine}}">
    <sc-if value="{{isMac}}" hint-placeholder-val="{{ true }}">
      <div style="align-self: center; display: flex; gap: 8px; margin-right: 12px">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
      </div>
    </sc-if>
    <div role="tablist" aria-label="{{t.tabs}}" style="align-self: stretch; display: flex; align-items: flex-end; gap: 4px; min-width: 0">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
        <button role="tab" aria-selected="{{tb.sel}}" style="height: {{tb.h}}; margin-bottom: {{tb.mb}}; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: {{tb.bg}}; border: 1px solid {{tb.line}}; border-bottom-color: {{tb.bottom}}; border-radius: 8px 8px 0 0; font: inherit; font-size: 12.5px; font-weight: {{tb.weight}}; color: {{tb.fg}}; white-space: nowrap">
          <sc-if value="{{tb.todo}}" hint-placeholder-val="{{ false }}">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"></rect><path d="M5.5 8l1.8 1.8L10.5 6"></path></svg>
          </sc-if>
          <sc-if value="{{tb.text}}" hint-placeholder-val="{{ true }}">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"></path></svg>
          </sc-if>
          <span style="max-width: 150px; overflow: hidden; text-overflow: ellipsis">{{tb.title}}</span>
          <sc-if value="{{tb.todo}}" hint-placeholder-val="{{ false }}">
            <span style="padding: 0 4px; border-radius: 4px; background: {{c.badgeTab}}; font-size: 11px; font-variant-numeric: tabular-nums; color: {{c.text2}}">{{doneCount}}/{{total}}</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
    <button aria-label="{{a.add}}" style="align-self: center; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: {{c.muted}}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
    </button>
    <div style="flex: 1"></div>
    <sc-if value="{{isWin}}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="align-self: stretch; display: flex; margin: 0 -8px 0 8px; color: {{c.text}}">
        <span style="width: 46px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M0 5h10"></path></svg></span>
        <span style="width: 46px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="9" height="9"></rect></svg></span>
        <span style="width: 46px; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M0 0l10 10M10 0L0 10"></path></svg></span>
      </div>
    </sc-if>
  </div>

        <div aria-hidden="true" style="height: 2px; margin: 0 0 0 48px; border-radius: 1px; background: {{c.dropLine}}"></div>

          <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="3" r="1.2"></circle><circle cx="7" cy="3" r="1.2"></circle><circle cx="3" cy="7" r="1.2"></circle><circle cx="7" cy="7" r="1.2"></circle><circle cx="3" cy="11" r="1.2"></circle><circle cx="7" cy="11" r="1.2"></circle></svg>
        </span>

        <input type="text" aria-label="{{t.itemAria}}" value="{{it.text}}" onChange="{{it.edit}}" onKeyDown="{{it.key}}" style="flex: 1; min-width: 0; height: 32px; padding: 0; border: 0; outline: none; background: transparent; font: inherit; color: {{it.fg}}; text-decoration: {{it.deco}}">
        <sc-if value="{{it.hover}}" hint-placeholder-val="{{ false }}">
          <button aria-label="{{a.del}}" onClick="{{it.remove}}" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: {{c.muted}}">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l6 6M11 5l-6 6"></path></svg>
          </button>
        </sc-if>
      </div>
    </sc-for>
    <label style="min-height: 36px; display: flex; align-items: center; gap: 8px; padding-left: 24px">
      <span aria-hidden="true" style="width: 14px; height: 14px; flex-shrink: 0; margin: 1px 5px 1px 1px; border: 1.5px dashed {{c.dashed}}; border-radius: 4px"></span>

        <div style="flex: 1"></div>

      </div>
    </sc-if>
    <sc-if value="{{showDone}}" hint-placeholder-val="{{ true }}">
      <sc-for list="{{done}}" as="it" hint-placeholder-count="3">
        <div onMouseEnter="{{it.enter}}" onMouseLeave="{{leave}}" onFocus="{{it.enter}}" style="min-height: 36px; display: flex; align-items: center; gap: 8px">

          <input type="text" aria-label="{{t.itemAria}}" value="{{it.text}}" onChange="{{it.edit}}" onKeyDown="{{it.key}}" style="flex: 1; min-width: 0; height: 32px; padding: 0; border: 0; outline: none; background: transparent; font: inherit; color: {{c.muted}}; text-decoration: line-through">
          <sc-if value="{{it.hover}}" hint-placeholder-val="{{ false }}">
            <button aria-label="{{a.del}}" onClick="{{it.remove}}" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: {{c.muted}}">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l6 6M11 5l-6 6"></path></svg>
            </button>
          </sc-if>
        </div>
      </sc-for>
    </sc-if>

    <sc-if value="{{dragging}}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="position: absolute; left: 88px; top: 38px; width: 560px; min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: {{c.panel}}; border: 1px solid {{c.btnLine}}; border-radius: 8px; box-shadow: {{c.pop}}; transform: scale(0.9) rotate(-0.6deg); transform-origin: left center; cursor: grabbing">
        <svg width="10" height="14" viewBox="0 0 10 14" fill="{{c.faint}}"><circle cx="3" cy="3" r="1.2"></circle><circle cx="7" cy="3" r="1.2"></circle><circle cx="3" cy="7" r="1.2"></circle><circle cx="7" cy="7" r="1.2"></circle><circle cx="3" cy="11" r="1.2"></circle><circle cx="7" cy="11" r="1.2"></circle></svg>
        <span style="width: 14px; height: 14px; margin-left: 4px; border: 1.5px solid {{c.dashed}}; border-radius: 4px"></span>
        <span>{{liftedText}}</span>
      </div>
    </sc-if>
  </div>

  <div style="height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 8px 0 16px; background: {{c.status}}; border-top: 1px solid {{c.line}}; font-size: 12px; color: {{c.muted}}; white-space: nowrap">
    <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{c.okDot}}"></span>{{t.saved}}</span>
    <span style="font-variant-numeric: tabular-nums">{{t.created}}</span>
    <span style="font-variant-numeric: tabular-nums">{{t.modified}}</span>
    <div style="flex: 1"></div>
    <span>{{hints}}</span>
    <span style="font-variant-numeric: tabular-nums">{{progress}}</span>
    <button onClick="{{copy}}" style="height: 24px; min-width: {{copyMin}}; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; background: {{copyBtn.bg}}; border: 1px solid {{copyBtn.line}}; border-radius: 4px; font: inherit; font-size: 12px; color: {{copyBtn.fg}}; white-space: nowrap">

        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg>
        {{t.copiedBtn}}
      </sc-if>
      <sc-if value="{{notCopied}}" hint-placeholder-val="{{ true }}">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect><path d="M10.5 3.5h-6a1 1 0 0 0-1 1v6"></path></svg>
        {{t.copyAll}}
        <span style="color: {{c.muted}}">{{kCopy}}</span>
      </sc-if>
    </button>
    <span role="status" aria-live="polite" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{copyAnnounce}}</span>
  </div>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" aria-live="polite" style="position: absolute; top: 56px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 4px 12px; min-height: 36px; box-sizing: border-box; background: {{c.toast}}; border: 1px solid {{c.toastLine}}; border-radius: 8px; font-size: 12.5px; color: {{c.toastText}}; white-space: nowrap; font-variant-numeric: tabular-nums">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="{{c.toastOk}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg>
      <span>{{toast.text}}</span>
      <sc-if value="{{toast.undoable}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{undo}}" style="height: 28px; display: inline-flex; align-items: center; gap: 8px; margin-right: -8px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; font: inherit; font-size: 12.5px; font-weight: 600; color: {{c.toastLink}}">{{t.undo}}<span style="width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid {{c.toastMuted}}; border-radius: 50%; font-size: 10.5px; font-weight: 500; color: {{c.toastMuted}}">{{left}}</span></button>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>

      { id: 4, zh: '清理 feature flag：refund_v1', en: 'Remove feature flag: refund_v1', done: true },
      { id: 5, zh: '跑一遍 kubectl rollout status', en: 'Run kubectl rollout status', done: true },
      { id: 6, zh: '更新 order-api 的 CHANGELOG', en: 'Update the order-api CHANGELOG', done: false },

    const dragging = (this.props.view ?? 'default') === 'dragging';
    const t = this.space(en
      ? { tabs: 'Open snippets', addAria: 'Add an item', itemAria: 'Item text', placeholder: 'Add an item, press Enter. Paste several lines to add several items', clearDone: 'Clear done', saved: 'Auto-saved', created: 'Created Nov 18, 13:10', modified: 'Edited 14:28', copyAll: 'Copy all', copiedBtn: 'Copied', undo: 'Undo' }
      : { tabs: '已打开的片段', addAria: '新增一项', itemAria: '事项内容', placeholder: '新增一项，回车确认；粘贴多行会拆成多项', clearDone: '清除已完成', saved: '已自动留存', created: '创建11-18 13:10', modified: '修改14:28', copyAll: '复制全部', copiedBtn: '已复制', undo: '撤销' });
    const a = en
      ? { add: `New: text snippet ${k('mod+N')}, todo list ${k('mod+T')}`, del: `Delete item ${k('mod+shift+backspace')}` }
      : { add: `新建：文本片段${k('mod+N')}，待办清单${k('mod+T')}`, del: `删除此项 ${k('mod+shift+backspace')}` };
    const items = this.state.items;
    const textOf = (it) => (en ? it.en : it.zh);
    const set = (patch) => this.setState(patch);
    const toggle = (id) => () => {
      const it = this.state.items.find((x) => x.id === id);
      const nowDone = !it.done;
      const settling = { ...this.state.settling };
      this.settle = this.settle || {};
      clearTimeout(this.settle[id]);
      if (nowDone) {
        settling[id] = true;
        this.settle[id] = setTimeout(() => {
          const s = { ...this.state.settling };
          delete s[id];
          this.setState({ settling: s });
        }, 900);
      } else {
        delete settling[id];
      }
      set({ items: this.state.items.map((x) => (x.id === id ? { ...x, done: nowDone } : x)), settling });
    };
    const edit = (id) => (e) => {
      const v = e.target.value;
      set({ items: this.state.items.map((x) => (x.id === id ? { ...x, zh: en ? x.zh : v, en: en ? v : x.en } : x)) });
    };
    const removeWithUndo = (id) => {
      const before = this.state.items;
      const it = before.find((x) => x.id === id);
      if (!it) return;
      this.undoItems = before;
      set({ items: before.filter((x) => x.id !== id) });
      this.showToast({ text: en ? `Deleted “${textOf(it)}”` : `已删除「${textOf(it)}」`, undoable: true });
    };
    const keyFor = (id) => (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (e.key === 'Backspace' && mod && e.shiftKey) { e.preventDefault(); removeWithUndo(id); return; }
      if (e.key === 'Backspace' && !mod && e.target.value === '') {
        e.preventDefault();
        set({ items: this.state.items.filter((x) => x.id !== id) });
        return;
      }
      if (e.key === 'Enter' && mod) { e.preventDefault(); toggle(id)(); }
    };
    const enter = (id) => () => set({ hover: id });
    const settling = this.state.settling;
    const openSrc = items.filter((i) => !i.done || settling[i.id]);
    const liftedId = 6;
    const openList = dragging ? openSrc.filter((i) => i.id !== liftedId) : openSrc;
    const lineIndex = 1;
    const shiftFor = (i) => {
      if (!dragging) return 'none';
      const n = i < lineIndex ? lineIndex - 1 - i : i - lineIndex;
      const amt = 8 * Math.pow(0.7, n);
      return `translateY(${i < lineIndex ? -amt : amt}px)`;
    };
    const deco = (it, i, inOpen) => ({
      id: it.id, done: it.done, text: textOf(it),
      checkAria: (en ? 'Done: ' : '完成：') + textOf(it),
      fg: it.done ? c.muted : c.text,
      deco: it.done ? 'line-through' : 'none',
      rowBg: it.fresh ? c.sel : 'transparent',
      hover: !dragging && this.state.hover === it.id,
      gripOpacity: !dragging && this.state.hover === it.id ? '1' : '0',
      lineBefore: inOpen && dragging && i === lineIndex,
      shift: inOpen ? shiftFor(i) : 'none',
      toggle: toggle(it.id), edit: edit(it.id), remove: () => removeWithUndo(it.id), enter: enter(it.id), key: keyFor(it.id)
    });
    const open = openList.map((it, i) => deco(it, i, true));
    const done = items.filter((i) => i.done && !settling[i.id]).map((it, i) => deco(it, i, false));
    const doneCount = items.filter((i) => i.done).length;
    const total = items.length;
    const toast = this.state.toast;
    const firstText = textOf(items[0] || { zh: '', en: '' });
    const tabsSrc = [
      { title: 'curl · POST /v2/orders/search' },
      { title: 'JSON · order_id A-20391' },
      { title: firstText, todo: true, active: true },
      { title: 'env · staging-b' },
      { title: en ? 'Weekly sync 11-18' : '周会 11-18' }
    ];
    const tabs = tabsSrc.map((tb) => ({
      title: tb.title, todo: !!tb.todo, text: !tb.todo, sel: String(!!tb.active),
      bg: tb.active ? c.bg : 'transparent', line: tb.active ? c.chromeLine : 'transparent', bottom: tb.active ? c.bg : 'transparent',
      fg: tb.active ? c.text : c.muted, weight: tb.active ? '500' : '400', h: tb.active ? '34px' : '32px', mb: tb.active ? '-1px' : '1px'
    }));
    const copied = this.state.copied;
    return {
      c, t, a, open, done, doneCount, total, tabs,
      doneLabel: en ? `Done ${doneCount}` : `已完成${doneCount}`,
      progress: en ? `${doneCount}/${total} done` : `${doneCount}/${total}已完成`,
      hints: en
        ? `${k('enter')} add · ${k('mod+enter')} done · ${k('alt')}↑↓ move · ${k('mod+shift+backspace')} delete`
        : `${k('enter')}新增 · ${k('mod+enter')}完成 · ${k('alt')}↑↓排序 · ${k('mod+shift+backspace')}删除`,
      kCopy: k('mod+shift+C'),
      copyMin: win ? '184px' : '136px',
      hasDone: done.length > 0,
      showDone: this.state.showDone && done.length > 0,
      expanded: String(this.state.showDone),
      chevron: this.state.showDone ? 'M4 6l4 4 4-4' : 'M6 4l4 4-4 4',
      dragging,
      liftedText: textOf(items.find((i) => i.id === liftedId) || items[0]),
      draft: this.state.draft,
      onDraft: (e) => set({ draft: e.target.value }),
      onDraftKey: (e) => {
        const text = this.state.draft.trim();
        if (e.key === 'Enter' && text) set({ items: [...this.state.items, { id: Date.now(), zh: text, en: text, done: false }], draft: '' });
      },
      onPaste: (e) => {
        const raw = (e.clipboardData && e.clipboardData.getData('text')) || '';
        const lines = raw.split(/\r?\n/).map((s) => s.replace(/^\s*(?:[-*]\s*)?(?:\[[ xX]\]\s*)?/, '').trim()).filter(Boolean);
        if (lines.length < 2) return;
        e.preventDefault();
        const before = this.state.items;
        this.undoItems = before;
        const now = Date.now();
        set({ items: [...before, ...lines.map((s, i) => ({ id: now + i, zh: s, en: s, done: false }))], draft: '' });
        this.showToast({ text: en ? `Split ${lines.length} pasted lines into ${lines.length} items` : `已把粘贴的${lines.length}行拆成${lines.length}项`, undoable: true });
      },
      leave: () => set({ hover: null }),
      toggleDone: () => set({ showDone: !this.state.showDone }),
      clearDone: () => {
        const before = this.state.items;
        const n = before.filter((i) => i.done).length;
        this.undoItems = before;
        set({ items: before.filter((i) => !i.done) });
        this.showToast({ text: en ? `Cleared ${n} done items` : `已清除${n}项已完成`, undoable: true });
      },
      undo: () => {
        if (this.undoItems) set({ items: this.undoItems });
        this.undoItems = null;
        this.showToast({ text: en ? 'Restored' : '已恢复', undoable: false });
      },
      copy: () => {
        clearTimeout(this.copyTimer);
        set({ copied: true });
        this.copyTimer = setTimeout(() => this.setState({ copied: false }), 2000);
      },
      copied, notCopied: !copied,
      copyBtn: copied ? { bg: c.okBg, line: c.okBg, fg: c.okText } : { bg: c.btn, line: c.btnLine, fg: c.text },
      copyAnnounce: copied ? (en ? `Copied as a plain-text list, ${total} items` : `已复制为纯文本清单，${total}项`) : '',
      hasToast: !!toast,
      toast: toast || { text: '', undoable: false },
      left: String(this.state.left),
      lang: en ? 'en' : 'zh-CN', isMac: !win, isWin: win
    };
  }
}
</script>
</body>
