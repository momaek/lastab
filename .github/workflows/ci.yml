name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The project needs no cgo (MyGo calls native code through purego).
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'macOS'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Vet other platforms
        if: runner.os == 'macOS'
        run: GOOS=windows go vet ./... && GOOS=linux go vet ./...
      - name: Test
        run: go test ./...
      - name: Catalogs are complete
        run: go tool mygo i18n check
      - name: Generated files are up to date
        if: runner.os == 'macOS'
        run: |
          go run ./scripts/gentokens
          go tool mygo generate
          git diff --exit-code -- internal/theme/tokens_gen.go locales/catalog_gen.go
      - name: Build
        run: |
          go build -o build-check/ .
          go build -o build-check/ ./cmd/lastab

  lint:
    runs-on: macos-latest
    env:
      # Exact versions: bump them deliberately, in their own commit.
      STATICCHECK_VERSION: "2026.2.2"
      GOVULNCHECK_VERSION: v1.10.0
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install linters
        # Built with the project's Go, so they understand its language version.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION
          go install golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: staticcheck
        run: staticcheck ./... && GOOS=windows staticcheck ./...
      - name: golangci-lint
        run: golangci-lint run ./... && GOOS=windows golangci-lint run ./...
      - name: govulncheck
        run: govulncheck ./...
